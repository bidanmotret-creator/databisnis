<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antrean Rekap Order</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e8ec; --muted:#98a2b3;
    --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --blue:#3b82f6;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;padding:16px;}
  h1{font-size:18px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .toolbar select, .toolbar input{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;font-size:13px;}
  button{cursor:pointer;border:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-green{background:var(--green);color:#062;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-ghost:hover{background:var(--panel);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
  .card.done{opacity:.55;}
  .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .name{font-size:15px;font-weight:700;}
  .phone{color:var(--muted);font-size:12px;}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;margin-right:6px;margin-bottom:4px;}
  .badge-wait{background:#3b2f0a;color:var(--amber);}
  .badge-ok{background:#0a2f18;color:var(--green);}
  .badge-no{background:#3b0a0a;color:var(--red);}
  .badge-repeat{background:#0a2333;color:var(--blue);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px 14px;font-size:13px;margin:10px 0;}
  .grid .k{color:var(--muted);font-size:11px;}
  .flags{margin:8px 0;font-size:12px;}
  .flags div{color:var(--amber);margin-bottom:2px;}
  .flags .ok{color:var(--green);}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;}
  .raw{white-space:pre-wrap;background:#0b0d11;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;color:var(--muted);margin-top:8px;max-height:160px;overflow:auto;display:none;}
  .edit-fields{display:none;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px;}
  .edit-fields input, .edit-fields select{width:100%;background:#0b0d11;border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:6px;font-size:12px;}
  .edit-fields label{font-size:10px;color:var(--muted);display:block;margin-bottom:2px;}
  .compose{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:20px;}
  .compose textarea{width:100%;min-height:120px;background:#0b0d11;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font-size:13px;font-family:inherit;}
  .toast{position:fixed;bottom:16px;right:16px;background:var(--panel);border:1px solid var(--border);padding:10px 16px;border-radius:8px;font-size:13px;display:none;}
  .empty{color:var(--muted);text-align:center;padding:40px 0;}
  .link-more{background:none;border:none;color:var(--blue);font-size:12px;cursor:pointer;padding:0;text-decoration:underline;}
</style>
</head>
<body>

<h1>Antrean Rekap Order</h1>
<div class="sub">Review pesan booking sebelum masuk ke Leads. Auto-approve mati -- semua wajib dicek manual.</div>

<div class="compose">
  <label class="grid-k" style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px;">Tempel pesan booking baru</label>
  <textarea id="teksBaru" placeholder="Tempel pesan 'Data Fix Booking Bidan Motret' di sini..."></textarea>
  <div class="actions">
    <button class="btn-primary" onclick="prosesTeksBaru()">Proses ke Antrean</button>
  </div>
</div>

<div class="toolbar">
  <select id="filterStatus" onchange="render()">
    <option value="menunggu_review">Menunggu Review</option>
    <option value="semua">Semua</option>
    <option value="disetujui">Disetujui</option>
    <option value="ditolak">Ditolak</option>
  </select>
  <button class="btn-ghost" onclick="muat()">Refresh</button>
  <span id="ringkasanCount" class="sub" style="margin:0;"></span>
</div>

<div id="daftar"></div>
<div id="toast" class="toast"></div>

<script>
  var scriptURL = 'https://script.google.com/macros/s/AKfycbzlRmMs01Ll7f_xQJ4obD5NfWQjXquAH8cYLgRfHXHcCUr0z7lSR1DbafsUIy8MfIea/exec';
  var DATA = [];

  function toast(msg, ok){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
    t.style.display = 'block';
    setTimeout(function(){ t.style.display = 'none'; }, 3500);
  }

  function fetchJsonAman(url, options){
    return fetch(url, options).then(function(res){
      return res.text().then(function(txt){
        try { return JSON.parse(txt); }
        catch(e){ throw new Error('Respons bukan JSON (kemungkinan dibatasi Google, coba lagi sebentar). Isi: ' + txt.substring(0,200)); }
      });
    });
  }

  function muat(){
    document.getElementById('daftar').innerHTML = '<div class="empty">Memuat...</div>';
    fetchJsonAman(scriptURL + '?action=getRekapOrderAntrean')
      .then(function(json){
        if (json.result !== 'success') throw new Error(json.message || 'Gagal memuat');
        DATA = json.antrean || [];
        render();
      })
      .catch(function(err){ toast(err.message, false); document.getElementById('daftar').innerHTML = '<div class="empty">Gagal memuat: '+err.message+'</div>'; });
  }

  function render(){
    var filter = document.getElementById('filterStatus').value;
    var data = DATA.filter(function(r){ return filter === 'semua' || r.status === filter; });
    document.getElementById('ringkasanCount').textContent = data.length + ' baris';

    if (data.length === 0){
      document.getElementById('daftar').innerHTML = '<div class="empty">Tidak ada data untuk filter ini.</div>';
      return;
    }

    document.getElementById('daftar').innerHTML = data.map(cardHtml).join('');
  }

  function fmtRp(n){ return 'Rp ' + (Number(n)||0).toLocaleString('id-ID'); }

  function badgeStatus(status){
    if (status === 'menunggu_review') return '<span class="badge badge-wait">Menunggu Review</span>';
    if (status === 'disetujui') return '<span class="badge badge-ok">Disetujui</span>';
    if (status === 'ditolak') return '<span class="badge badge-no">Ditolak</span>';
    return '<span class="badge">'+status+'</span>';
  }

  function cardHtml(r){
    var flagList = (r.flag_review === 'TRUE' || r.flag_review === true)
      ? String(r.catatan_review || '').split(' | ').filter(Boolean)
      : [];
    var isDone = r.status !== 'menunggu_review';
    var riwayat = r.riwayat_leads || [];

    var flagsHtml = flagList.length
      ? flagList.map(function(f){ return '<div>&#9888; '+escapeHtml(f)+'</div>'; }).join('')
      : '<div class="ok">&#10003; Tidak ada flag, aman diperiksa cepat</div>';

    var riwayatOptions = riwayat.map(function(b){
      return '<option value="'+escapeAttr(b.kode_leads)+'">'+escapeHtml(b.kode_leads)+' ('+(b.sudah_bayar?'sudah bayar':'belum bayar')+', '+escapeHtml(String(b.tanggal_chat))+')</option>';
    }).join('');

    var repeatBadge = (r.is_repeat_order === 'TRUE' || r.is_repeat_order === true)
      ? '<span class="badge badge-repeat">Repeat Order ke-'+r.repeat_ke+'</span>' : '';

    var actionsHtml = isDone ? (
      '<div class="actions"><span class="sub" style="margin:0;">Diproses: '+escapeHtml(String(r.waktu_diproses||''))+
      (r.kode_leads_hasil ? ' &rarr; '+escapeHtml(r.kode_leads_hasil) : '') +'</span></div>'
    ) : (
      '<div class="actions">' +
        '<button class="btn-green" onclick="approve(\''+r.id_antrean+'\', this)">Setujui (baris baru)</button>' +
        (riwayat.length ? '<button class="btn-primary" onclick="toggleUpdateMode(this)">Update baris lama...</button>' : '') +
        '<button class="btn-ghost" onclick="toggleEdit(this)">Edit dulu</button>' +
        '<button class="btn-red" onclick="tolak(\''+r.id_antrean+'\', this)">Tolak</button>' +
        '<button class="btn-ghost" onclick="toggleRaw(this)">Lihat pesan asli</button>' +
      '</div>' +
      (riwayat.length ? (
        '<div class="update-mode" style="display:none;margin-top:8px;">' +
          '<select class="sel-kode-target">'+riwayatOptions+'</select> ' +
          '<button class="btn-primary" onclick="approveUpdate(\''+r.id_antrean+'\', this)">Konfirmasi Update Baris Ini</button>' +
        '</div>'
      ) : '') +
      '<div class="edit-fields" style="display:grid;">' +
        field('nama', r.nama) + field('no_hp', r.no_hp) + field('alamat', r.domisili) +
        field('minat', r.paket_kata_kunci) + field('paket', r.paket_mentah) +
        field('data_anak', r.data_anak_mentah) + field('gender_anak', r.gender_anak) +
        field('tanggal_chat', r.tanggal_chat) + field('tgl_bayar1', r.tgl_bayar1) +
        field('jml_bayar1', r.jml_bayar1) + field('total', r.total_dihitung) + field('transport', r.transport) +
      '</div>'
    );

    return (
      '<div class="card'+(isDone?' done':'')+'">' +
        '<div class="row">' +
          '<div><div class="name">'+escapeHtml(r.nama||'(tanpa nama)')+'</div><div class="phone">'+escapeHtml(r.no_hp||'-')+'</div></div>' +
          '<div>'+badgeStatus(r.status)+' '+repeatBadge+'</div>' +
        '</div>' +
        '<div class="grid">' +
          gridItem('Domisili', r.domisili) + gridItem('Data Anak', r.data_anak_mentah) +
          gridItem('Gender', r.gender_anak) + gridItem('Paket', r.paket_mentah) +
          gridItem('Kata Kunci', r.paket_kata_kunci) + gridItem('Tgl Chat', r.tanggal_chat) +
          gridItem('DP', (r.tgl_bayar1||'-')+' / '+fmtRp(r.jml_bayar1)) + gridItem('Sisa', fmtRp(r.sisa_tertulis)) +
          gridItem('Total', fmtRp(r.total_dihitung)) + gridItem('Transport', fmtRp(r.transport)) +
        '</div>' +
        '<div class="flags">'+flagsHtml+'</div>' +
        actionsHtml +
        '<div class="raw">'+escapeHtml(r.teks_asli||'')+'</div>' +
      '</div>'
    );
  }

  function field(name, val){
    return '<div><label>'+name+'</label><input data-field="'+name+'" value="'+escapeAttr(val)+'"></div>';
  }
  function gridItem(k, v){
    return '<div><div class="k">'+k+'</div><div>'+escapeHtml(v===undefined||v===null||v===''?'-':String(v))+'</div></div>';
  }
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function escapeAttr(s){ return escapeHtml(s); }

  function toggleRaw(btn){ var el = btn.closest('.card').querySelector('.raw'); el.style.display = el.style.display === 'block' ? 'none' : 'block'; }
  function toggleEdit(btn){ var el = btn.closest('.card').querySelector('.edit-fields'); el.style.display = el.style.display === 'grid' ? 'none' : 'grid'; }
  function toggleUpdateMode(btn){ var el = btn.closest('.card').querySelector('.update-mode'); el.style.display = el.style.display === 'block' ? 'none' : 'block'; }

  function readOverride(card){
    var override = {};
    card.querySelectorAll('.edit-fields input').forEach(function(inp){
      if (inp.value !== '') override[inp.dataset.field] = inp.value;
    });
    return override;
  }

  function prosesTeksBaru(){
    var teks = document.getElementById('teksBaru').value.trim();
    if (!teks){ toast('Tempel dulu pesannya.', false); return; }
    fetchJsonAman(scriptURL, {
      method: 'POST',
      headers: {'Content-Type':'application/x-www-form-urlencoded'},
      body: 'action=prosesRekapOrderManual&teksAsli=' + encodeURIComponent(teks)
    }).then(function(json){
      if (json.result !== 'success') throw new Error(json.message || 'Gagal memproses');
      toast('Masuk antrean: ' + json.data.id_antrean, true);
      document.getElementById('teksBaru').value = '';
      muat();
    }).catch(function(err){ toast(err.message, false); });
  }

  function approve(idAntrean, btn, mode, kodeLeadsTarget){
    var card = btn.closest('.card');
    var override = readOverride(card);
    var body = 'action=approveRekapOrder&idAntrean=' + encodeURIComponent(idAntrean) +
      '&overrideJson=' + encodeURIComponent(JSON.stringify(override));
    if (mode) body += '&mode=' + encodeURIComponent(mode);
    if (kodeLeadsTarget) body += '&kodeLeadsTarget=' + encodeURIComponent(kodeLeadsTarget);

    btn.disabled = true; btn.textContent = 'Memproses...';
    fetchJsonAman(scriptURL, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: body })
      .then(function(json){
        if (json.result !== 'success') throw new Error(json.message || 'Gagal approve');
        toast('Disetujui -> ' + json.data.kodeLeads, true);
        muat();
      })
      .catch(function(err){ toast(err.message, false); btn.disabled = false; btn.textContent = 'Setujui (baris baru)'; });
  }

  function approveUpdate(idAntrean, btn){
    var card = btn.closest('.card');
    var kode = card.querySelector('.sel-kode-target').value;
    approve(idAntrean, btn, 'update_existing', kode);
  }

  function tolak(idAntrean, btn){
    var alasan = prompt('Alasan menolak (opsional):') || '';
    btn.disabled = true;
    fetchJsonAman(scriptURL, {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: 'action=tolakRekapOrder&idAntrean=' + encodeURIComponent(idAntrean) + '&alasan=' + encodeURIComponent(alasan)
    }).then(function(json){
      if (json.result !== 'success') throw new Error(json.message || 'Gagal menolak');
      toast('Ditolak.', true);
      muat();
    }).catch(function(err){ toast(err.message, false); btn.disabled = false; });
  }

  muat();
</script>
</body>
</html>
